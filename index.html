<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aplikasi Tabungan</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  .container {
    width: 100%;
    max-width: 500px;
    background: #fff;
    border-radius: 16px;
    padding: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
  h1 { text-align: center; color: #333; margin-bottom: 20px; font-size: 22px; }

  .saldo-box {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    margin-bottom: 20px;
  }
  .saldo-box small { opacity: 0.85; font-size: 13px; }
  .saldo-box h2 { font-size: 32px; margin-top: 6px; }
  .saldo-box .waktu {
    font-size: 11px;
    opacity: 0.85;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.25);
  }

  .form-group { margin-bottom: 12px; }
  label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; font-weight: 600; }
  input, select {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus, select:focus { border-color: #667eea; }

  .row { display: flex; gap: 10px; }
  .row .form-group { flex: 1; }

  button {
    width: 100%;
    padding: 12px;
    background: #667eea;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #5568d3; }

  /* Tombol WA */
  .btn-wa {
    background: #25D366;
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-wa:hover { background: #1ebe5b; }
  .btn-wa:disabled { background: #b0b0b0; cursor: not-allowed; }

  .wa-config {
    background: #f0fdf4;
    border: 1px dashed #25D366;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 12px;
  }
  .wa-config label { color: #128c3e; }

  .divider { margin: 20px 0 15px; border-top: 1px solid #eee; }

  .riwayat-title {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    font-weight: 700;
    color: #333;
    margin-bottom: 10px;
  }

  .riwayat { max-height: 350px; overflow-y: auto; }
  .item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    background: #f8f9fc;
    border-radius: 8px;
    margin-bottom: 8px;
    border-left: 4px solid #667eea;
    gap: 8px;
  }
  .item.keluar { border-left-color: #e74c3c; }
  .item .info { flex: 1; min-width: 0; }
  .item .info strong {
    display: block;
    font-size: 14px;
    color: #333;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item .info small {
    display: block;
    color: #888;
    font-size: 11px;
    margin-top: 3px;
    line-height: 1.4;
  }
  .item .info small .jam { color: #667eea; font-weight: 600; }
  .item .nominal { font-weight: 700; font-size: 13px; white-space: nowrap; }
  .item .nominal.masuk { color: #27ae60; }
  .item .nominal.keluar { color: #e74c3c; }
  .item button.hapus {
    width: auto;
    padding: 4px 8px;
    font-size: 12px;
    background: #ffdddd;
    color: #e74c3c;
    margin-left: 4px;
    flex-shrink: 0;
  }
  .item button.hapus:hover { background: #e74c3c; color: #fff; }

  .kosong { text-align: center; color: #aaa; font-size: 13px; padding: 15px; }
</style>
</head>
<body>
<div class="container">
  <h1>💰 Aplikasi Tabungan</h1>

  <!-- Saldo -->
  <div class="saldo-box">
    <small>Saldo Saat Ini</small>
    <h2 id="saldo">Rp 0</h2>
    <div class="waktu" id="waktuSekarang"></div>
  </div>

  <!-- Konfigurasi Nomor WA Admin -->
  <div class="wa-config">
    <label>📱 Nomor WhatsApp Admin</label>
    <input type="tel" id="waAdmin" placeholder="Contoh: 6281234567890" />
    <small style="color:#666;font-size:11px;">
      Format: <b>62</b> diikuti nomor (tanpa +, tanpa 0 di depan, tanpa spasi)
    </small>
  </div>

  <!-- Form Input -->
  <div class="form-group">
    <label>Keterangan</label>
    <input type="text" id="keterangan" placeholder="Contoh: Gaji, Jajan, dll" />
  </div>

  <div class="row">
    <div class="form-group">
      <label>Jenis Transaksi</label>
      <select id="jenis">
        <option value="masuk">Uang Masuk</option>
        <option value="keluar">Uang Keluar</option>
      </select>
    </div>
    <div class="form-group">
      <label>Nominal (Rp)</label>
      <input type="number" id="nominal" placeholder="0" min="1" />
    </div>
  </div>

  <button onclick="tambahTransaksi()">+ Simpan Transaksi</button>

  <!-- Tombol Kirim ke WA -->
  <button class="btn-wa" id="btnKirimWA" onclick="kirimKeWA()">
    <span>📤</span> Kirim Riwayat ke WA Admin
  </button>

  <div class="divider"></div>

  <div class="riwayat-title">
    <span>Riwayat Transaksi</span>
    <span id="totalTransaksi" style="color:#667eea;">0</span>
  </div>
  <div class="riwayat" id="riwayat"></div>
</div>

<script>
  // ====== Daftar nama hari & bulan ======
  const NAMA_HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
  const NAMA_BULAN = [
    'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
    'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
  ];

  // ====== Format tanggal lengkap ======
  function formatTanggalLengkap(date = new Date()) {
    const hari    = NAMA_HARI[date.getDay()];
    const tanggal = date.getDate();
    const bulan   = NAMA_BULAN[date.getMonth()];
    const tahun   = date.getFullYear();
    const jam     = String(date.getHours()).padStart(2, '0');
    const menit   = String(date.getMinutes()).padStart(2, '0');
    const detik   = String(date.getSeconds()).padStart(2, '0');
    return `${hari}, ${tanggal} ${bulan} ${tahun} • ${jam}:${menit}:${detik}`;
  }

  function formatJam(date = new Date()) {
    const jam   = String(date.getHours()).padStart(2, '0');
    const menit = String(date.getMinutes()).padStart(2, '0');
    const detik = String(date.getSeconds()).padStart(2, '0');
    return `${jam}:${menit}:${detik}`;
  }

  function formatTanggal(date = new Date()) {
    return `${NAMA_HARI[date.getDay()]}, ${date.getDate()} ${NAMA_BULAN[date.getMonth()]} ${date.getFullYear()}`;
  }

  // ====== Data & helper ======
  let transaksi = JSON.parse(localStorage.getItem('tabungan')) || [];
  const rupiah = (angka) => 'Rp ' + angka.toLocaleString('id-ID');
  const simpan = () => localStorage.setItem('tabungan', JSON.stringify(transaksi));

  // Simpan nomor WA admin ke localStorage
  const waInput = document.getElementById('waAdmin');
  waInput.value = localStorage.getItem('waAdmin') || '';
  waInput.addEventListener('input', () => localStorage.setItem('waAdmin', waInput.value));

  // ====== Tambah transaksi ======
  function tambahTransaksi() {
    const keterangan = document.getElementById('keterangan').value.trim();
    const jenis      = document.getElementById('jenis').value;
    const nominal    = parseInt(document.getElementById('nominal').value);

    if (!keterangan) return alert('Keterangan tidak boleh kosong!');
    if (!nominal || nominal <= 0) return alert('Nominal harus lebih dari 0!');
    if (jenis === 'keluar' && nominal > hitungSaldo()) {
      return alert('Saldo tidak cukup! Saldo saat ini: ' + rupiah(hitungSaldo()));
    }

    const sekarang = new Date();
    transaksi.unshift({
      id: Date.now(),
      keterangan,
      jenis,
      nominal,
      timestamp: sekarang.toISOString(),
      tanggalLengkap: formatTanggalLengkap(sekarang),
      jam: formatJam(sekarang),
      tanggal: formatTanggal(sekarang)
    });

    simpan();
    render();

    document.getElementById('keterangan').value = '';
    document.getElementById('nominal').value = '';
    document.getElementById('keterangan').focus();
  }

  function hitungSaldo() {
    return transaksi.reduce((total, t) => {
      return t.jenis === 'masuk' ? total + t.nominal : total - t.nominal;
    }, 0);
  }

  function hapusTransaksi(id) {
    if (!confirm('Hapus transaksi ini?')) return;
    transaksi = transaksi.filter(t => t.id !== id);
    simpan();
    render();
  }

  // ====== Render tampilan ======
  function render() {
    document.getElementById('saldo').textContent = rupiah(hitungSaldo());
    document.getElementById('totalTransaksi').textContent = transaksi.length + ' transaksi';

    const list = document.getElementById('riwayat');

    if (transaksi.length === 0) {
      list.innerHTML = '<div class="kosong">Belum ada transaksi</div>';
      document.getElementById('btnKirimWA').disabled = true;
      return;
    }
    document.getElementById('btnKirimWA').disabled = false;

    list.innerHTML = transaksi.map(t => `
      <div class="item ${t.jenis}">
        <div class="info">
          <strong>${t.keterangan}</strong>
          <small>
            📅 ${t.tanggalLengkap ? t.tanggalLengkap.split('•')[0].trim() : t.tanggal}
            <br>
            🕐 <span class="jam">${t.jam || ''}</span>
          </small>
        </div>
        <div style="display:flex; align-items:center;">
          <span class="nominal ${t.jenis}">
            ${t.jenis === 'masuk' ? '+' : '-'} ${rupiah(t.nominal)}
          </span>
          <button class="hapus" onclick="hapusTransaksi(${t.id})">✕</button>
        </div>
      </div>
    `).join('');
  }

  // ====== FORMAT PESAN WHATSAPP ======
  function buatPesanWA() {
    const saldo = hitungSaldo();
    const totalMasuk  = transaksi.filter(t => t.jenis === 'masuk').reduce((s,t) => s + t.nominal, 0);
    const totalKeluar = transaksi.filter(t => t.jenis === 'keluar').reduce((s,t) => s + t.nominal, 0);

    let pesan = '';
    pesan += '📊 *LAPORAN TABUNGAN*\n';
    pesan += '━━━━━━━━━━━━━━━━━━\n';
    pesan += `🗓️ Tanggal Kirim : ${formatTanggalLengkap(new Date())}\n`;
    pesan += `👤 Total Transaksi : ${transaksi.length} data\n\n`;

    pesan += '*💵 RINGKASAN SALDO*\n';
    pesan += `✅ Total Masuk   : ${rupiah(totalMasuk)}\n`;
    pesan += `❌ Total Keluar  : ${rupiah(totalKeluar)}\n`;
    pesan += `💰 *Saldo Akhir* : ${rupiah(saldo)}\n\n`;

    pesan += '━━━━━━━━━━━━━━━━━━\n';
    pesan += '*📋 DETAIL RIWAYAT*\n\n';

    transaksi.forEach((t, i) => {
      const simbol = t.jenis === 'masuk' ? '🟢 MASUK' : '🔴 KELUAR';
      pesan += `*${i + 1}. ${t.keterangan}*\n`;
      pesan += `   ${simbol} : ${rupiah(t.nominal)}\n`;
      pesan += `   📅 ${t.tanggalLengkap ? t.tanggalLengkap.split('•')[0].trim() : t.tanggal}\n`;
      pesan += `   🕐 ${t.jam || ''}\n\n`;
    });

    pesan += '━━━━━━━━━━━━━━━━━━\n';
    pesan += '_Pesan otomatis dari Aplikasi Tabungan_';

    return pesan;
  }

  // ====== KIRIM KE WHATSAPP ======
  function kirimKeWA() {
    const nomor = waInput.value.trim().replace(/[^0-9]/g, '');

    // Validasi nomor
    if (!nomor) {
      alert('⚠️ Isi nomor WhatsApp admin terlebih dahulu!\nContoh: 6281234567890');
      waInput.focus();
      return;
    }
    if (!nomor.startsWith('62')) {
      if (!confirm('Nomor tidak diawali 62 (kode Indonesia).\nLanjutkan tetap?')) return;
    }
    if (nomor.length < 10) {
      alert('⚠️ Nomor terlalu pendek. Cek kembali!');
      return;
    }

    // Validasi data
    if (transaksi.length === 0) {
      alert('Belum ada transaksi untuk dikirim.');
      return;
    }

    // Buat pesan & encode
    const pesan = buatPesanWA();
    const url = `https://wa.me/${62085167728103}?text=${encodeURIComponent(pesan)}`;

    // Buka WhatsApp (tab baru)
    window.open(url, '_blank');
  }

  // ====== Update jam real-time ======
  function updateWaktuSekarang() {
    document.getElementById('waktuSekarang').textContent =
      '⏰ ' + formatTanggalLengkap(new Date());
  }
  setInterval(updateWaktuSekarang, 1000);
  updateWaktuSekarang();

  // Enter key submit
  document.getElementById('nominal').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') tambahTransaksi();
  });

  render();
</script>
</body>
</html>
